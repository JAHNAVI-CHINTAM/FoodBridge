# Render Blueprint Specification for Food Bridge
# Learn more at: https://render.com/docs/blueprint-spec

services:
  # 1. Backend Express API Web Service
  - type: web
    name: food-bridge-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

  # 2. Frontend React + Vite Static Site
  - type: web
    name: food-bridge-web
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Single Page Application (SPA) routing fallback
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://food-bridge-api.onrender.com/api
